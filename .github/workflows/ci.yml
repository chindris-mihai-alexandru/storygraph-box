name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install "audible[cryptography]" PyGithub pytest ruff
      - name: Lint
        run: ruff check storygraph_box.py tests
      - name: Test
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t storygraph-box .
      - name: Smoke test the image the way GitHub runs a Docker action
        run: |
          # A consumer's workspace holds their own repo, never this action's code,
          # so mount a directory with nothing in it but the export.
          mkdir -p "$RUNNER_TEMP/consumer"
          cp tests/sample_export.csv "$RUNNER_TEMP/consumer/storygraph_export.csv"
          docker run --rm \
            --workdir /github/workspace -v "$RUNNER_TEMP/consumer":/github/workspace \
            -e INPUT_CSV_PATH=storygraph_export.csv -e INPUT_GOAL_BOOKS=12 \
            -e INPUT_WRAP_WIDTH=50 -e INPUT_DRY_RUN=true \
            storygraph-box > out.txt 2> err.txt
          cat out.txt
          grep -qx "latest reads" out.txt
          grep -q "Project Hail Mary by Andy Weir" out.txt
          grep -Eq "^read [0-9]+ of 12 books in [0-9]{4}$" out.txt
          if grep -q Traceback err.txt; then cat err.txt; exit 1; fi
