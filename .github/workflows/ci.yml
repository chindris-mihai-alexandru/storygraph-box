name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install "audible[cryptography]" PyGithub pytest ruff
      - name: Lint
        run: ruff check storygraph_box.py tests
      - name: Test
        run: pytest -q