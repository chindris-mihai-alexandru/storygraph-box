name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check storygraph_box.py tests
          ruff check --target-version py39 sync_monitor.py
      - name: Test with line and branch coverage
        run: |
          coverage run -m pytest -q
          coverage report

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t storygraph-box .
      - name: Smoke test the image the way GitHub runs a Docker action
        run: |
          # A consumer's workspace holds their own repo, never this action's code,
          # so mount a directory with nothing in it but the export.
          mkdir -p "$RUNNER_TEMP/consumer"
          cp tests/sample_export.csv "$RUNNER_TEMP/consumer/storygraph_export.csv"
          docker run --rm \
            --workdir /github/workspace -v "$RUNNER_TEMP/consumer":/github/workspace \
            -e INPUT_CSV_PATH=storygraph_export.csv -e INPUT_GOAL_BOOKS=12 \
            -e INPUT_WRAP_WIDTH=50 -e INPUT_DRY_RUN=true \
            storygraph-box > out.txt 2> err.txt || { cat err.txt; exit 1; }
          cat out.txt
          grep -qx "latest reads" out.txt
          grep -q "Project Hail Mary by Andy Weir" out.txt
          grep -Eq "^read [0-9]+ of 12 books in [0-9]{4}$" out.txt
          if grep -q Traceback err.txt; then cat err.txt; exit 1; fi

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Audit the pinned runtime dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --strict
