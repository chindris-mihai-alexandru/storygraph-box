name: 'storygraph-box'
description: 'Update a pinned gist with your latest StoryGraph reads, listens and Audible listening time'
branding:
  icon: 'book-open'
  color: 'green'
inputs:
  gist_id:
    description: 'The ID portion of your gist URL'
    required: true
  csv_path:
    description: 'Path to the StoryGraph CSV export committed in your repo'
    required: false
    default: 'storygraph_export.csv'
  wrap_width:
    description: 'Wrap book lines at this width, matching ashtom-style gists. Set to 0 for one line per book'
    required: false
    default: '50'
  title_max:
    description: 'Drop a title subtitle when a line is longer than this many characters and the short form fits. 0 keeps full titles. About 52 suits the pinned card'
    required: false
    default: '0'
  output_style:
    description: 'classic for grouped lists, compact for an emoji summary including all parallel reads and finished-book totals'
    required: false
    default: 'classic'
  goal_books:
    description: 'Yearly reading goal in books. Leave empty to hide the classic goal line'
    required: false
    default: ''
  audible_locale:
    description: 'Audible marketplace locale code, e.g. uk, de, com'
    required: false
    default: 'uk'
  dry_run:
    description: 'Print the rendered gist body to the log instead of updating the gist. Useful to preview a layout'
    required: false
    default: 'false'
runs:
  using: 'docker'
  image: 'Dockerfile'